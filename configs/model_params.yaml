catboost:
  task_type: GPU
  devices: "0"
  loss_function: Logloss
  learning_rate: 0.05
  depth: 8
  l2_leaf_reg: 3
  iterations: 1000
  early_stopping_rounds: 50
  random_seed: 42
  verbose: 100

optuna:
  n_trials: 20
  timeout: 900
  params:
    depth: [6, 8, 10]
    learning_rate: [0.03, 0.05, 0.1]
    l2_leaf_reg: [1, 3, 5]
    iterations: [600, 800, 1000, 1200]

postprocessing:
  enabled: true
  clip_threshold: 0.99

nan_flags:
  top_n: 50

validation:
  val_size: 150000

svd:
  n_components: 100
  random_state: 42

adversarial:
  importance_threshold: 0.01
  random_state: 42
  top_n_plot: 30

rolling_encoding:
  enabled: true
  feature_prefix: "rolling"
